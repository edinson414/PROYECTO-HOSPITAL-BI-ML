[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "hospital_bi_ml"
version = "0.0.1"
description = "Proyecto End-to-End de BI y Machine Learning para an\u00e1lisis hospitalario y predicci\u00f3n de inasistencias."
authors = [
  { name = "edinson saldarriaga" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["hospital_bi_ml"]
include = ["pyproject.toml", "hospital_bi_ml/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["hospital_bi_ml"]
force-sort-within-sections = true

